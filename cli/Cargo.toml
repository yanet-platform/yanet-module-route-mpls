# Standalone workspace: the yanet2 root workspace deliberately does not
# include out-of-tree module CLIs (see the comment in the root Cargo.toml),
# so this crate carries its own [workspace] table and is built through its
# own manifest.
[workspace]

[package]
name = "yanet-cli-route-mpls"
version = "0.1.0"
edition = "2024"
publish = false

rust-version = "1.88"

# Inlined from the yanet2 root workspace's [workspace.lints]: this crate
# is its own workspace and cannot inherit them.
[lints.rust]
unused_crate_dependencies = "deny"

[lints.clippy]
std_instead_of_core = "deny"

[dependencies]
ync = { path = "../../../cli/core", package = "yanet-cli" }
commonpb = { path = "../../../common/rust/commonpb", package = "yanet-commonpb" }
netip = "0.3"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
prost = "0.14"
tonic = { version = "0.14", features = ["gzip"] }
tonic-prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[build-dependencies]
ync-build = { path = "../../../cli/ync-build", package = "yanet-cli-build" }
